name: tagged-release

on:
  push:
    tags:
      - 'v[1-9].[0-9]+.[0-9]+'

jobs:
  integration-tests:
    name: 'Integration Tests'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.26.10

      - name: Run integration tests
        run: make test_integration

  github-release:
    name: 'GitHub Release'
    needs: integration-tests
    runs-on: 'ubuntu-latest'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # https://github.com/marketplace/actions/goreleaser-action#usage
          # note the fetch-depth: 0 input in Checkout step. It is required for
          # the changelog to work correctly
          fetch-depth: 0

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.26.10

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  snapcraft-stable:
    name: 'Snapcraft: Stable Release'
    needs: integration-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            elf-machine: Advanced Micro Devices X86-64
          - arch: arm64
            runner: ubuntu-24.04-arm
            elf-machine: AArch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 fetches all history for all branches and tags
          fetch-depth: 0

      - name: Build snap
        uses: snapcore/action-build@v1
        id: build

      - name: Verify snap
        id: verify
        shell: bash
        env:
          SNAP_PATH: ${{ steps.build.outputs.snap }}
          SNAP_ARCH: ${{ matrix.arch }}
          ELF_MACHINE: ${{ matrix.elf-machine }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y squashfs-tools binutils python3-yaml
          snap_dir="$(mktemp -d)/snap"
          trap 'rm -rf "$(dirname "$snap_dir")"' EXIT
          unsquashfs -d "$snap_dir" "$SNAP_PATH"
          python3 - "$snap_dir/meta/snap.yaml" <<'PYTHON'
          import os
          import sys
          import yaml

          with open(sys.argv[1]) as metadata:
              assert yaml.safe_load(metadata)["architectures"] == [os.environ["SNAP_ARCH"]]
          PYTHON
          readelf -h "$snap_dir/bin/doctl.real" | grep -q "Machine:.*${ELF_MACHINE}"
          "$snap_dir/bin/doctl.real" version

      - uses: snapcore/action-publish@master
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAP_TOKEN }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable
